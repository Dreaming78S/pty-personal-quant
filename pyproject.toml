[project]
name = "my-a-stock-quant"
version = "0.1.0"
description = "A股量化选股与回测系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pymysql>=1.1",
    "tushare>=1.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "matplotlib>=3.8",
    "lark-oapi>=1.7.3",
]

[project.scripts]
quant = "quant.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: 需要真实 MySQL/Tushare 的集成测试"]
